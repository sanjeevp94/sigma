[project]
name = "sigma-bi-as-code"
version = "0.1.0"
description = "Sigma BI-as-Code ecosystem via GitOps"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "jsonschema>=4.21.1",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
